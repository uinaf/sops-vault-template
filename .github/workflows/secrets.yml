name: Scan

# No push trigger: pull requests scan the same tree before merge and the
# weekly schedule covers history.
on:
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # Keep generated vaults independent of an organization-specific pin policy.
    # The existing GitHub Actions Dependabot entry maintains this immutable pin.
    uses: uinaf/.github/.github/workflows/scan.yml@19763dae1f4585b31de4cac3801cae58d1453293
