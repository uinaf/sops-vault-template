name: Scan

# No push trigger: pull requests scan the same tree before merge and the
# weekly schedule covers history.
on:
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # Keep generated vaults independent of an organization-specific pin policy.
    # Renovate maintains this immutable pin through renovate.json.
    uses: uinaf/.github/.github/workflows/scan.yml@d801c9ca10dd474243e078c303004f7648e97224
