name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOPS_VERSION: 3.13.3
      SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes age jq shellcheck
          asset="sops-v${SOPS_VERSION}.linux.amd64"
          curl --fail --location --silent --show-error \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          printf '%s  %s\n' "$SOPS_SHA256" "${RUNNER_TEMP}/${asset}" \
            | sha256sum --check --status
          sudo install -m 0755 "${RUNNER_TEMP}/${asset}" /usr/local/bin/sops

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false

      - name: Run full template verification
        run: mise run verify

      - name: Scan
        if: ${{ !cancelled() }}
        uses: uinaf/.github/.github/actions/scan@7bc3f9ea25b5494f4026dfdb64fb866a520afcd0 # v3.0.0
